syntax = "proto3";

package wizard_structs;

option go_package = "github.com/shocknet/lightning.pub";

message Empty {}

message StateResponse {
    bool config_sent = 1;
    bool admin_linked = 2;
}
// Empty host means the Lightning.Pub backup server; empty user/pass derive the login from the seed.
// pass is never returned; an empty pass on update keeps the saved one for the same host and user.
message RemoteBackup {
    bool enabled = 1;
    string host = 2;
    int64 port = 3;
    string user = 4;
    string pass = 5;
    string host_fingerprint = 6;
}
message ConfigRequest {
    string source_name = 1;
    string relay_url = 2;
    bool automate_liquidity = 3;
    RemoteBackup remote_backup = 4;
    string avatar_url = 5;
}
message AdminConnectInfoResponse {
    string nprofile = 1;
    oneof connect_info {
        string admin_token = 2;
        string enrolled_npub = 3;
    }
}
enum LndState {
    OFFLINE = 0;
    SYNCING = 1;
    ONLINE = 2;
}
message ServiceStateResponse {
    string provider_name = 1;
    repeated string relays = 2;
    string admin_npub = 3;
    bool relay_connected = 4;
    LndState lnd_state = 5;
    bool watchdog_ok = 6;
    string http_url = 7;
    string nprofile = 8;
    string source_name = 9;
    string relay_url = 10;
    bool automate_liquidity = 11;
    RemoteBackup remote_backup = 12;
    string avatar_url = 13;
    string app_id = 14;
    bool has_seed = 15;
    bool is_db_clean = 16;
}

message FtpCreds {
    string user = 1;
    string pass = 2;
}
// Custom SFTP restore target. port 0 means 22. host_fingerprint is required unless
// host+port is the managed Lightning.Pub backup server (which stays pinned in code).
message FtpHost {
    string host = 1;
    int64 port = 2;
    string host_fingerprint = 3;
}
message RestoreRequest {
    string phrase = 1;
    oneof source {
        Empty cloud = 2;
        FtpHost ftp_host = 3;
        string local_path = 4;
    }
    optional FtpCreds creds_override = 5;
}

message RestoreResponse {
    bool success = 1;
    string error = 2;
    int64 entries_restored = 3;
    bool scb_restored = 4;
}